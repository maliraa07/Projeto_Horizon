name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Copiar build para docs/
        run: |
          rm -rf docs
          cp -r dist docs

      - name: Commit docs/ no main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: publicar site no GitHub Pages (docs/)'
          file_pattern: docs
